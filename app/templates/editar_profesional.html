{% extends 'base.html' %}{% block content %}<h1>Editar funcionario</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for name,label in [('nombre','Nombre'),('cargo','Cargo'),('especialidad','Especialidad')] %}<label>{{ label }}<input name="{{ name }}" value="{{ request.form.get(name,profesional[name]) }}" maxlength="{{ 200 if name=='nombre' else 100 }}" required></label>{% endfor %}<button>Guardar cambios</button></form>{% endblock %}
