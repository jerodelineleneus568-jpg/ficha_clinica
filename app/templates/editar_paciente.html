{% extends 'base.html' %}{% block content %}<h1>Editar paciente</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for name,label in [('documento','Documento'),('nombre','Nombre completo'),('telefono','Teléfono'),('correo','Correo')] %}<label>{{ label }}<input name="{{ name }}" maxlength="{{ 40 if name in ['documento','telefono'] else 200 }}" value="{{ request.form.get(name,paciente[name]) }}" {% if name in ['documento','nombre'] %}required{% endif %}></label>{% endfor %}<label>Nacimiento<input name="nacimiento" type="date" value="{{ request.form.get('nacimiento',paciente.nacimiento) }}" required></label><button>Guardar cambios</button></form>{% endblock %}
