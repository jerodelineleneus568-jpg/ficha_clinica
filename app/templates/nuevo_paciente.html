{% extends 'base.html' %}{% block content %}<h1>Registrar paciente</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for name,label,length in [('documento','RUT u otro documento',40),('nombre','Nombre completo',200),('telefono','Teléfono',40),('correo','Correo',200)] %}<label>{{ label }}<input name="{{ name }}" maxlength="{{ length }}" value="{{ request.form.get(name,'') }}" {% if name in ['documento','nombre'] %}required{% endif %} {% if name == 'correo' %}type="email"{% endif %}></label>{% endfor %}<label>Fecha de nacimiento<input type="date" name="nacimiento" value="{{ request.form.get('nacimiento','') }}" required></label><button>Guardar paciente</button></form>{% endblock %}
