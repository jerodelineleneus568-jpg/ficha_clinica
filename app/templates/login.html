{% extends 'base.html' %}{% block content %}<h1>Iniciar sesión</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Usuario<input name="username" maxlength="50" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" maxlength="128" autocomplete="current-password" required></label><button>Ingresar</button></form><p>La sesión vence después de 15 minutos sin actividad. Si aún no tienes cuenta, contacta al administrador.</p>{% endblock %}
