{% extends 'base.html' %}{% block content %}<h1>Editar bloque de agenda</h1><p>{{ bloque.funcionario }} · {{ bloque.fecha }} · {{ bloque.tipo }}</p><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><input type="hidden" name="version" value="{{ bloque.version }}"><label>Inicio<input type="time" name="inicio" value="{{ request.form.get('inicio',bloque.inicio) }}" required></label><label>Fin<input type="time" name="fin" value="{{ request.form.get('fin',bloque.fin) }}" required></label><label>Cupos<input type="number" name="cupos" min="1" max="20" value="{{ request.form.get('cupos',bloque.cupos) }}" required></label><p>Hay {{ bloque.ocupados }} cupos ocupados. Los horarios con citas deben reprogramarse antes de cambiar sus horas.</p><button>Guardar cambios</button></form>{% endblock %}
