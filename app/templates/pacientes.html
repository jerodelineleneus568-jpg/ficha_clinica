{% extends 'base.html' %}{% block content %}<h1>Pacientes</h1>{% if g.usuario.rol in ['admin','recepcion'] %}<a class="boton" href="{{ url_for('clinica.nuevo_paciente') }}">Registrar paciente</a>{% endif %}<form method="get"><label>Buscar por nombre o documento<input name="q" value="{{ q }}"></label><button>Buscar</button></form><div class="tabla"><table><thead><tr><th>Documento</th><th>Nombre</th><th>Ficha</th></tr></thead><tbody>{% for p in pacientes %}<tr><td>{{ p.documento }}</td><td>{{ p.nombre }}</td><td><a class="boton" href="{{ url_for('clinica.ficha', id=p.id) }}">Ver ficha</a></td></tr>{% else %}<tr><td colspan="3">No hay pacientes para mostrar.</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
