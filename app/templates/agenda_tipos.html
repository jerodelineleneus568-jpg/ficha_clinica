{% extends 'base.html' %}{% block content %}<h1>Tipos de atención</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Nombre<input name="nombre" maxlength="100" required></label><div class="campos"><label>Duración sugerida, minutos<input name="minutos" type="number" min="5" max="240" value="60" required></label><label>Cupos sugeridos por bloque<input name="cupos" type="number" min="1" max="20" value="1" required></label></div><button>Crear tipo de atención</button></form><table><thead><tr><th>Tipo</th><th>Duración / cupos</th><th>Estado</th><th>Acción</th></tr></thead><tbody>{% for t in tipos %}<tr><td>{{ t.nombre }}</td><td>{{ t.minutos }} min / {{ t.cupos }}</td><td>{{ 'Activo' if t.activo else 'Desactivado' }}</td><td><a href="{{ url_for('agenda.editar_tipo',id=t.id) }}">Editar / desactivar</a></td></tr>{% endfor %}</tbody></table>{% endblock %}
