{% extends 'base.html' %}{% block content %}<h1>Editar cuenta de usuario</h1><form method="post" data-role-form><input type="hidden" name="csrf" value="{{ session.csrf }}">{% for name,label in [('username','Usuario'),('nombre','Nombre completo')] %}<label>{{ label }}<input name="{{ name }}" value="{{ request.form.get(name,usuario[name]) }}" maxlength="{{ 50 if name=='username' else 200 }}" required></label>{% endfor %}<label>Rol<select name="rol">{% for r in roles %}<option value="{{ r }}" {% if request.form.get('rol',usuario.rol)==r %}selected{% endif %}>{{ r }}</option>{% endfor %}</select></label><label>Funcionario (rol profesional)<select name="profesional_id"><option value="">Sin vínculo</option>{% for p in profesionales %}<option value="{{ p.id }}" {% if request.form.get('profesional_id',usuario.profesional_id|string)==p.id|string %}selected{% endif %}>{{ p.nombre }} — {{ p.cargo }}</option>{% endfor %}</select></label><label>Paciente (rol paciente)<select name="paciente_id"><option value="">Sin vínculo</option>{% for p in pacientes %}<option value="{{ p.id }}" {% if request.form.get('paciente_id',usuario.paciente_id|string)==p.id|string %}selected{% endif %}>{{ p.nombre }} — {{ p.documento }}</option>{% endfor %}</select></label><label>Nueva contraseña (opcional)<input name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password"></label><p>Los cambios cerrarán todas las sesiones de esta cuenta.</p><button>Guardar cambios</button></form>{% endblock %}
