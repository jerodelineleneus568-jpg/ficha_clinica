{% extends 'base.html' %}{% block content %}<h1>Cambiar contraseña</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Contraseña actual<input name="anterior" type="password" maxlength="128" autocomplete="current-password" required></label><label>Nueva contraseña (12–128 caracteres)<input name="nueva" type="password" minlength="12" maxlength="128" autocomplete="new-password" required></label><button>Guardar y cerrar sesiones</button></form>{% endblock %}
