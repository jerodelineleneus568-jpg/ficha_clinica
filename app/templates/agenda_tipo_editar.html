{% extends 'base.html' %}{% block content %}<h1>Editar tipo de atención</h1><form method="post"><input type="hidden" name="csrf" value="{{ session.csrf }}"><label>Nombre<input name="nombre" maxlength="100" value="{{ request.form.get('nombre',tipo.nombre) }}" required></label><label>Minutos sugeridos<input name="minutos" type="number" min="5" max="240" value="{{ request.form.get('minutos',tipo.minutos) }}" required></label><label>Cupos sugeridos<input name="cupos" type="number" min="1" max="20" value="{{ request.form.get('cupos',tipo.cupos) }}" required></label><label>Estado<select name="activo"><option value="1" {% if tipo.activo %}selected{% endif %}>Activo</option><option value="0" {% if not tipo.activo %}selected{% endif %}>Desactivado</option></select></label><p>La duración y los cupos de agendas ya creadas se conservan.</p><button>Guardar cambios</button></form>{% endblock %}
